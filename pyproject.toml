[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pisight"
version = "0.1.0"
description = "A Raspberry Pi local face recognition toolkit built around OpenCV."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Yakup24" }
]
dependencies = [
  "numpy>=1.23",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6"
]

[project.scripts]
pisight = "raspberry_face_recognition.cli:main"
raspberry-face-recognition = "raspberry_face_recognition.cli:main"

[tool.setuptools.packages.find]
include = ["raspberry_face_recognition*", "pisight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

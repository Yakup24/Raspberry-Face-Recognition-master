[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pisight"
version = "0.2.0"
description = "A Raspberry Pi local face embedding toolkit with PyTorch and FAISS."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Yakup24" }
]
keywords = [
  "opencv",
  "raspberry-pi",
  "face-recognition",
  "computer-vision",
  "edge-ai",
  "privacy"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Recognition"
]
dependencies = [
  "numpy>=1.23",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
deep = [
  "torch>=2.0.0",
  "torchvision>=0.15.0",
  "facenet-pytorch>=2.5.3",
  "faiss-cpu>=1.7.4"
]
agent = [
  "openai>=1.0.0",
  "requests>=2.31.0"
]
dev = [
  "pytest>=8",
  "ruff>=0.6"
]
all = [
  "torch>=2.0.0",
  "torchvision>=0.15.0",
  "facenet-pytorch>=2.5.3",
  "faiss-cpu>=1.7.4",
  "openai>=1.0.0",
  "requests>=2.31.0",
  "pytest>=8",
  "ruff>=0.6"
]

[project.scripts]
pisight = "raspberry_face_recognition.cli:main"
raspberry-face-recognition = "raspberry_face_recognition.cli:main"

[tool.setuptools.packages.find]
include = ["raspberry_face_recognition*", "pisight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
